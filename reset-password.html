<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | SweetSlice Admin</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --cream:#FFFDF9; --pink:#F4B8CC; --pink-deep:#EDA0BC; --pink-pale:#FDF0F5;
    --lavender-pale:#F3EEFA; --plum-dark:#4A3B54; --plum:#6B5876; --plum-light:#9a8a9e;
    --white:#FFFFFF; --danger:#D9737B; --ok:#3E8B4F;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Poppins',sans-serif;background:var(--lavender-pale);color:var(--plum-dark);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:var(--white);border-radius:20px;padding:40px 34px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(74,59,84,0.1);text-align:center;}
  .logo{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:22px;margin-bottom:6px;}
  .sub{font-size:12.5px;color:var(--plum-light);margin-bottom:26px;line-height:1.6;}
  .field{margin-bottom:14px;text-align:left;}
  .field label{display:block;font-size:12px;color:var(--plum);margin-bottom:6px;}
  .field input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid #EADFE8;background:var(--cream);font-family:'Poppins',sans-serif;font-size:13.5px;color:var(--plum-dark);}
  .btn{background:var(--plum-dark);color:var(--cream);border:none;padding:12px;border-radius:24px;font-size:13.5px;font-weight:500;cursor:pointer;width:100%;margin-top:6px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .msg{font-size:12.5px;margin-top:14px;line-height:1.6;}
  .msg.error{color:var(--danger);}
  .msg.success{color:var(--ok);}
  .msg a{color:var(--plum-dark);font-weight:500;}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="logo">SweetSlice</div>
  <div class="sub" id="sub">Checking your reset link…</div>

  <div id="form-area" style="display:none;">
    <div class="field"><label>New password</label><input type="password" id="new-password" placeholder="At least 6 characters"></div>
    <div class="field"><label>Confirm new password</label><input type="password" id="confirm-password" placeholder="Repeat password"></div>
    <button class="btn" id="submit-btn" onclick="submitNewPassword()">Set new password</button>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
  const SUPABASE_URL = "https://utphrlxlwtkhrywqgsir.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_6K8X6iAxo8e-HOPX2WI8Xg_62JYlZMX";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const sub = document.getElementById('sub');
  const formArea = document.getElementById('form-area');
  const msg = document.getElementById('msg');

  function showMessage(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + (type || '');
  }

  async function init() {
    // Supabase recovery links put the tokens in the URL hash, e.g.
    // #access_token=...&refresh_token=...&type=recovery
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = hashParams.get('access_token');
    const refreshToken = hashParams.get('refresh_token');
    const type = hashParams.get('type');

    if (!accessToken || type !== 'recovery') {
      sub.textContent = "This page is for setting a new password after clicking a reset link from your email.";
      showMessage('No valid reset link found — request a new one from the Supabase dashboard (Authentication → Users → your account → send a recovery link), or from the admin login screen if that option is available there.', 'error');
      return;
    }

    const { error } = await supabaseClient.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
    if (error) {
      sub.textContent = "This reset link has expired or already been used.";
      showMessage('Request a new password reset link and try again — links are typically only valid for a limited time and can only be used once.', 'error');
      return;
    }

    sub.textContent = "Enter a new password for your admin account.";
    formArea.style.display = 'block';
  }

  async function submitNewPassword() {
    const pw = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;
    const btn = document.getElementById('submit-btn');

    if (pw.length < 6) { showMessage('Password should be at least 6 characters.', 'error'); return; }
    if (pw !== confirm) { showMessage("Passwords don't match.", 'error'); return; }

    btn.disabled = true;
    btn.textContent = 'Saving…';

    const { error } = await supabaseClient.auth.updateUser({ password: pw });

    if (error) {
      showMessage("Couldn't update the password: " + error.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Set new password';
      return;
    }

    formArea.style.display = 'none';
    sub.textContent = '';
    showMessage('Password updated! You can now log in with your new password.', 'success');
    msg.innerHTML += '<br><a href="admin.html">Go to admin login →</a>';
  }

  init();
</script>

</body>
</html>
